# Official GLM Chat Completions judge. The key is read only from the environment.
base_url: https://open.bigmodel.cn/api/paas/v4/
model: glm-5.3
api_key_env: ZAI_API_KEY
timeout_seconds: 180
max_attempts: 3
retry_delay_seconds: 2
max_tokens: 4096
# Optional model-specific fields, e.g. temperature, thinking, response_format.
# Reserved request fields (model, messages, stream, max_tokens) cannot be overridden here.
request_parameters: {}
