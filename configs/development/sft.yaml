model_name: Qwen/Qwen3-4B-Instruct-2507
output_dir: outputs/development/qwen3-4b-instruct-openr1-lora
num_train_epochs: 3
learning_rate: 0.0001
per_device_train_batch_size: 1
per_device_eval_batch_size: 1
logging_steps: 10
eval_strategy: steps
eval_steps: 500
save_strategy: steps
save_steps: 500
save_total_limit: 2
lora:
  r: 16
  lora_alpha: 32
  lora_dropout: 0.05
data:
  name: open-r1/OpenR1-Math-220k
  config: default
  split: train
  revision: main
max_length: 8192
max_new_tokens: 8192
bf16: true
gradient_checkpointing: true
gradient_checkpointing_kwargs:
  use_reentrant: false
