# 本机开发环境：8 GB 显存。仅显式选择此文件时使用。
model_name: Qwen/Qwen3-0.6B
training_mode: lora
lora:
  r: 16
  lora_alpha: 32
  lora_dropout: 0.05
output_dir: outputs/development/qwen3-0.6b-gsm8k-lora
num_train_epochs: 3
learning_rate: 0.0001
per_device_train_batch_size: 1
gradient_accumulation_steps: 16
optim: adamw_torch_fused
bf16: auto
gradient_checkpointing: true
gradient_checkpointing_kwargs:
  use_reentrant: false
logging_steps: 10
logging_first_step: true
save_strategy: epoch
save_total_limit: 2
report_to: tensorboard
seed: 42
